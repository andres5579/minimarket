<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minimarket - Gestión de Productos</title>

    <link rel="stylesheet" href="/css/estilos.css">

</head>

<body>

    <div class="contenedor">

        <!-- MENÚ LATERAL -->

        <aside class="menu">

            <h2 class="logo">

            🛒 MiniMarket

            </h2>

            <p class="version">

            Versión 1.0

            </p>

            <ul>

                <li><a href="/">🏠 Dashboard</a></li>
                <li class="activo"><a href="/productos">📦 Productos</a></li>
                <li><a href="/clientes">👥 Clientes</a></li>
                <li><a href="/empleados">👨‍💼 Empleados</a></li>
                <li><a href="/inventario">📋 Inventario</a></li>
                <li><a href="/ventas">🧾 Ventas</a></li>
                <li><a href="/detalleventa">📄 Detalle Venta</a></li>

            </ul>

        </aside>

        <!-- CONTENIDO -->

        <main class="contenido">

            <header class="encabezado">

                <div>

                    <h1>Sistema de Minimarket</h1>

                    <p>Panel Administrativo</p>

                </div>

                <div class="infoUsuario">

                    <span id="fechaHora"></span>

                    <div class="usuario">

                        👤 Administrador

                    </div>

                </div>

            </header>

            <h2>Gestión de Productos</h2>

            <form id="formProducto">

                <input type="hidden" id="idProducto">

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre del producto"
                    required>

                <input
                    type="text"
                    id="codigoBarra"
                    placeholder="Código de barras"
                    required>

                <input
                    type="number"
                    id="precioVenta"
                    placeholder="Precio de venta"
                    required>

                <input
                    type="number"
                    id="precioCompra"
                    placeholder="Precio de compra"
                    required>

                <input
                    type="text"
                    id="categoria"
                    placeholder="Categoría">

                <input
                    type="text"
                    id="unidadMedida"
                    placeholder="Unidad de medida">

                <input
                    type="date"
                    id="fechaVencimiento">

                <button type="submit">

                    Guardar Producto

                </button>

            </form>

            <hr>

            <h2>Listado de Productos</h2>

            <input
                type="text"
                id="buscar"
                placeholder="Buscar producto por nombre..."
                onkeyup="filtrarProductos()">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Código</th>
                        <th>Precio Venta</th>
                        <th>Categoría</th>
                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody id="tablaProductos">

                </tbody>

            </table>

        </main>

    </div>

    <script src="/js/productos.js"></script>

</body>

</html>
