<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniMarket | Gestión de Empleados</title>

    <link rel="stylesheet" href="/css/estilos.css">

</head>

<body>

<div class="contenedor">

    <!-- MENÚ -->

    <aside class="menu">

        <h2 class="logo">🛒 MiniMarket</h2>

        <p class="version">Versión 2.1</p>

        <ul>

            <li>
                <a href="/dashboard">🏠 Dashboard</a>
            </li>

            <li>
                <a href="/productos">📦 Productos</a>
            </li>

            <li id="menuClientes">
                <a href="/clientes">👥 Clientes</a>
            </li>

            <li class="activo" id="menuEmpleados">
                <a href="/empleados">👨‍💼 Empleados</a>
            </li>

            <li id="menuInventario">
                <a href="/inventario">📋 Inventario</a>
            </li>

            <li id="menuVentas">
                <a href="/ventas">🧾 Ventas</a>
            </li>

            <li>
                <a href="/detalleventa">📄 Detalle Venta</a>
            </li>

            <li>
                <a href="/login/logout">🚪 Cerrar sesión</a>
            </li>

        </ul>

    </aside>

    <!-- CONTENIDO -->

    <main class="contenido">

        <header class="encabezado">

            <div>

                <h1>Sistema de Gestión MiniMarket</h1>

                <p>Gestión de Empleados</p>

            </div>

            <div class="infoUsuario">

                <span id="fechaHora"></span>

                <div class="usuario">

                    👤 <strong id="nombreUsuario"></strong>

                </div>

                <div class="usuario" style="margin-top:10px;">

                    🔐 <span id="rolUsuario"></span>

                </div>

            </div>

        </header>

        <h2>Gestión de Empleados</h2>

        <form id="formEmpleado">

            <input
                type="hidden"
                id="idEmpleado">

            <input
                type="text"
                id="nombre"
                placeholder="Nombre del empleado"
                required>

            <input
                type="text"
                id="rol"
                placeholder="Rol"
                required>

            <input
                type="text"
                id="usuario"
                placeholder="Usuario"
                required>

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                required>

            <button type="submit">

                Guardar Empleado

            </button>

        </form>

        <hr>

        <h2>Listado de Empleados</h2>

        <input
            type="text"
            id="buscar"
            placeholder="Buscar empleado...">

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Rol</th>
                    <th>Usuario</th>
                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody id="tablaEmpleados">

            </tbody>

        </table>

    </main>

</div>

<script src="/js/sesion.js"></script>
<script src="/js/empleados.js"></script>

</body>

</html>
