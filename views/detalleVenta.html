<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minimarket - Detalle de Ventas</title>

    <link rel="stylesheet" href="/css/estilos.css">

</head>

<body>

<div class="contenedor">

    <!-- MENÚ LATERAL -->

    <aside class="menu">

        <h2 class="logo">

            🛒 MiniMarket

        </h2>

        <p class="version">

            Versión 1.0

        </p>

        <ul>

            <li><a href="/">🏠 Dashboard</a></li>
            <li><a href="/productos">📦 Productos</a></li>
            <li><a href="/clientes">👥 Clientes</a></li>
            <li><a href="/empleados">👨‍💼 Empleados</a></li>
            <li><a href="/inventario">📋 Inventario</a></li>
            <li><a href="/ventas">🧾 Ventas</a></li>
            <li class="activo"><a href="/detalleventa">📄 Detalle Venta</a></li>

        </ul>

    </aside>

    <!-- CONTENIDO -->

    <main class="contenido">

        <header class="encabezado">

            <div>

                <h1>Sistema de Minimarket</h1>

                <p>Panel Administrativo</p>

            </div>

            <div class="infoUsuario">

                <span id="fechaHora"></span>

                <div class="usuario">

                    👤 Administrador

                </div>

            </div>

        </header>

        <h2>Detalle de Ventas</h2>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Venta</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Empleado</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                    <th>Subtotal</th>
                    <th>Total</th>

                </tr>

            </thead>

            <tbody id="tablaDetalle">

            </tbody>

        </table>

    </main>

</div>

<script src="/js/detalleVenta.js"></script>

</body>

</html>
