<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniMarket | Registro de Ventas</title>

    <link rel="stylesheet" href="/css/estilos.css">

</head>

<body>

<div class="contenedor">

    <!-- MENÚ -->

    <aside class="menu">

        <h2 class="logo">🛒 MiniMarket</h2>

        <p class="version">Versión 2.1</p>

        <ul>

            <li>
                <a href="/dashboard">🏠 Dashboard</a>
            </li>

            <li>
                <a href="/productos">📦 Productos</a>
            </li>

            <li id="menuClientes">
                <a href="/clientes">👥 Clientes</a>
            </li>

            <li id="menuEmpleados">
                <a href="/empleados">👨‍💼 Empleados</a>
            </li>

            <li id="menuInventario">
                <a href="/inventario">📋 Inventario</a>
            </li>

            <li class="activo" id="menuVentas">
                <a href="/ventas">🧾 Ventas</a>
            </li>

            <li id="menuDetalleVenta">
                <a href="/detalleventa">📄 Detalle Venta</a>
            </li>

            <li>
                <a href="/login/logout">🚪 Cerrar sesión</a>
            </li>

        </ul>

    </aside>

    <!-- CONTENIDO -->

    <main class="contenido">

        <header class="encabezado">

            <div>

                <h1>Sistema de Gestión MiniMarket</h1>

                <p>Registro de Ventas</p>

            </div>

            <div class="infoUsuario">

                <span id="fechaHora"></span>

                <div class="usuario">

                    👤 <strong id="nombreUsuario"></strong>

                </div>

                <div class="usuario" style="margin-top:10px;">

                    🔐 <span id="rolUsuario"></span>

                </div>

            </div>

        </header>

        <h2>Registro de Venta</h2>

        <div class="formulario">

            <select id="cliente" required>

                <option value="">Seleccione un cliente</option>

            </select>

            <select id="empleado" required>

                <option value="">Seleccione un empleado</option>

            </select>

            <select id="producto">

                <option value="">Seleccione un producto</option>

            </select>

            <input
                type="number"
                id="cantidad"
                min="1"
                value="1">

            <button id="agregarProducto">

                Agregar Producto

            </button>

        </div>

        <br>

        <table>

            <thead>

                <tr>

                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                    <th>Acción</th>

                </tr>

            </thead>

            <tbody id="detalleVenta">

            </tbody>

        </table>

        <br>

        <div class="total">

            <h2>

                Total:
                $

                <span id="totalVenta">

                    0.00

                </span>

            </h2>

        </div>

        <br>

        <select id="metodoPago">

            <option>Efectivo</option>
            <option>Tarjeta</option>
            <option>Transferencia</option>
            <option>Nequi</option>
            <option>Daviplata</option>

        </select>

        <button id="guardarVenta">

            Registrar Venta

        </button>

    </main>

</div>

<script src="/js/sesion.js"></script>
<script src="/js/ventas.js"></script>

</script>

</body>

</html>
